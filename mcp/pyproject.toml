[project]
name = "rdp-mcp"
version = "0.1.0"
description = "MCP-server die een lopende rdp-mcp-client (FreeRDP) bestuurt: screenshots, muis en toetsenbord"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=11",
]

[project.scripts]
rdp-mcp = "rdp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdp_mcp"]
